<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dr. Jaskeet — Coming soon</title>
  <meta name="description" content="Coming soon.">
  <meta name="theme-color" content="#F6F0E6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317332F'/%3E%3Ccircle cx='32' cy='27' r='9' fill='%23E8862E'/%3E%3Cpath d='M32 36v16' stroke='%23F6F0E6' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=5">
  <style>
    /* Coming-soon page: only the words "Coming soon", with the story site's prints and colours. */
    body { min-height: 100vh; min-height: 100svh; display: grid; }
    main { display: grid; position: relative; overflow: hidden; }
    .soon.hero {
      min-height: 0; width: 100%;
      padding: 40px var(--gutter);
      grid-template-columns: 1fr;
      justify-items: center; align-content: center;
      gap: clamp(28px, 5vh, 56px);
      text-align: center;
    }
    .soon h1 { font-size: clamp(54px, 13vw, 132px); animation: rise .9s cubic-bezier(.2, .7, .2, 1) .5s both; }
    .soon .hero__stack { max-width: 440px; width: 100%; height: clamp(230px, 62vw, 330px); margin: 0; }
    .soon .hero__stack .print { width: 44%; padding-bottom: clamp(26px, 6vw, 38px); }
    .soon .print--a { left: 2%; top: 8%; }
    .soon .print--b { left: 28%; top: 0; }
    .soon .print--c { right: 2%; left: auto; top: 12%; }
    @keyframes rise { from { opacity: 0; translate: 0 18px; } }

    /* The prints drop in, then bob gently. */
    .soon .print { animation: drop .9s cubic-bezier(.2, .8, .2, 1) both, bob 6s ease-in-out infinite; }
    .soon .print--a { animation-delay: .1s, 1.1s; }
    .soon .print--b { animation-delay: .25s, 1.7s; animation-duration: .9s, 7s; }
    .soon .print--c { animation-delay: .4s, 1.4s; animation-duration: .9s, 6.5s; }
    @keyframes drop { from { opacity: 0; translate: 0 -40px; } }
    @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -9px; } }

    .rays { transform-origin: 60px 56px; animation: spin 24s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Particle field: canvas fills <main>, above the page background, below the hero. */
    .field { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: block; }
    .soon.hero { position: relative; z-index: 1; }
  </style>
</head>
<body>


  <main>
    <canvas class="field" aria-hidden="true"></canvas>

    <section class="hero soon">
      <div class="hero__stack" aria-hidden="true">
        <figure class="print print--a">
          <div class="print__img tone-sage">
            <svg viewBox="0 0 120 150">
              <path d="M60 138V74" class="ln"/>
              <path d="M60 112c-14-2-22-10-24-22 13 0 21 8 24 22zM60 100c12-3 19-10 21-21-12 1-19 8-21 21z" class="ln"/>
              <g class="fill">
                <circle cx="60" cy="38" r="11"/><circle cx="43" cy="50" r="11"/><circle cx="77" cy="50" r="11"/>
                <circle cx="49" cy="68" r="11"/><circle cx="71" cy="68" r="11"/>
              </g>
              <circle cx="60" cy="55" r="8" class="dot"/>
            </svg>
          </div>
        </figure>
        <figure class="print print--b">
          <div class="print__img tone-juice">
            <svg viewBox="0 0 120 150">
              <g transform="rotate(-10 42 86)">
                <path d="M28 58h30l-4 56H32z" class="ln"/>
                <path d="M30 76h26l-2.6 36H32.6z" class="fill"/>
              </g>
              <g transform="rotate(10 78 86)">
                <path d="M62 58h30l-4 56H66z" class="ln"/>
                <path d="M64 76h26l-2.6 36H66.6z" class="fill"/>
              </g>
              <path d="M60 30v12M46 36l5 9M74 36l-5 9" class="ln"/>
            </svg>
          </div>
        </figure>
        <figure class="print print--c">
          <div class="print__img tone-blush">
            <svg viewBox="0 0 120 150">
              <circle cx="60" cy="56" r="20" class="fill"/>
              <path class="ln rays" d="M60 20v8M60 84v8M24 56h8M88 56h8M35 31l6 6M79 75l6 6M85 31l-6 6M41 75l-6 6"/>
              <path d="M14 122c18-10 34-10 46 0s30 10 46 0" class="ln"/>
            </svg>
          </div>
        </figure>
      </div>

      <h1>Coming <em>soon</em></h1>
    </section>
  </main>


  <script>
  (function () {
    'use strict';
    var canvas = document.querySelector('.field');
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;

    /* ---- Tunables ---- */
    var AREA_PER_PARTICLE = 14500;  /* px^2 per particle: ~70 on 1280x800, ~26 on 375x812 */
    var MIN_COUNT = 26, MAX_COUNT = 80;
    var REPEL_RADIUS = 140;         /* px */
    var REPEL_STRENGTH = 2.4;       /* push strength right at the cursor (higher = stronger) */
    var DRIFT_SPEED = 0.28;         /* px/frame at 60fps, typical wander speed */
    var TURN = 0.04;                /* how fast the wander heading changes (rad/frame) */
    var EASE = 0.025;               /* how quickly velocity settles back to drift (per frame) */
    var DPR_CAP = 2;

    var COLORS = ['#E8862E', '#C9D6C4', '#EBCFBD', '#17332F'];
    var ALPHAS = [0.6, 0.85, 0.9, 0.16];            /* green kept faint */
    var PICK = [0, 0, 0, 1, 1, 1, 2, 2, 2, 3];      /* weighted colour choice, green ~10% */

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var W = 0, H = 0, dpr = 1, n = 0;
    var X, Y, VX, VY, R, HD, SP, CI;
    var px = 0, py = 0, active = false;
    var rect = canvas.getBoundingClientRect();
    var raf = 0, last = 0;

    function rnd(a, b) { return a + Math.random() * (b - a); }

    function seed(i) {
      var big = Math.random() < 0.12;
      X[i] = Math.random() * W;
      Y[i] = Math.random() * H;
      R[i] = big ? rnd(10, 14) : 3 + Math.pow(Math.random(), 1.8) * 7;
      HD[i] = Math.random() * 6.2832;
      SP[i] = DRIFT_SPEED * rnd(0.5, 1.4) * (big ? 0.6 : 1);
      VX[i] = Math.cos(HD[i]) * SP[i];
      VY[i] = Math.sin(HD[i]) * SP[i];
      CI[i] = PICK[(Math.random() * PICK.length) | 0];
    }

    function resize() {
      var w = canvas.clientWidth, h = canvas.clientHeight;
      if (!w || !h) return;
      var oldW = W, oldH = H;
      dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      W = w; H = h;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      rect = canvas.getBoundingClientRect();
      var want = Math.max(MIN_COUNT, Math.min(MAX_COUNT, Math.round(W * H / AREA_PER_PARTICLE)));
      if (want !== n || !X) {
        n = want;
        X = new Float32Array(n); Y = new Float32Array(n);
        VX = new Float32Array(n); VY = new Float32Array(n);
        R = new Float32Array(n); HD = new Float32Array(n);
        SP = new Float32Array(n); CI = new Uint8Array(n);
        for (var i = 0; i < n; i++) seed(i);
      } else if (oldW && oldH) {
        var sx = W / oldW, sy = H / oldH;
        for (var j = 0; j < n; j++) { X[j] *= sx; Y[j] *= sy; }
      }
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < n; i++) {
        var c = CI[i];
        ctx.globalAlpha = ALPHAS[c];
        ctx.fillStyle = COLORS[c];
        ctx.beginPath();
        ctx.arc(X[i], Y[i], R[i], 0, 6.2832);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function frame(t) {
      raf = requestAnimationFrame(frame);
      var dt = last ? (t - last) / 16.667 : 1;
      last = t;
      if (dt > 3) dt = 3;
      var r2 = REPEL_RADIUS * REPEL_RADIUS;
      var ease = 1 - Math.pow(1 - EASE, dt);
      for (var i = 0; i < n; i++) {
        /* wander: heading random-walks, velocity eases toward it */
        HD[i] += (Math.random() - 0.5) * TURN * 2 * dt;
        VX[i] += (Math.cos(HD[i]) * SP[i] - VX[i]) * ease;
        VY[i] += (Math.sin(HD[i]) * SP[i] - VY[i]) * ease;
        /* cursor repulsion: stronger the closer it is */
        if (active) {
          var dx = X[i] - px, dy = Y[i] - py, d2 = dx * dx + dy * dy;
          if (d2 < r2) {
            var d = Math.sqrt(d2) || 0.001;
            var k = 1 - d / REPEL_RADIUS;
            var f = REPEL_STRENGTH * k * k * 0.72 * dt / d;
            VX[i] += dx * f;
            VY[i] += dy * f;
          }
        }
        X[i] += VX[i] * dt;
        Y[i] += VY[i] * dt;
        /* wrap off the edges */
        var m = R[i] + 2;
        if (X[i] < -m) X[i] = W + m; else if (X[i] > W + m) X[i] = -m;
        if (Y[i] < -m) Y[i] = H + m; else if (Y[i] > H + m) Y[i] = -m;
      }
      draw();
    }

    function start() { if (!raf && !reduce && !document.hidden) { last = 0; raf = requestAnimationFrame(frame); } }
    function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

    function onMove(e) {
      px = e.clientX - rect.left;
      py = e.clientY - rect.top;
      active = true;
    }
    function off() { active = false; }

    resize();
    window.addEventListener('resize', resize);
    if (reduce) return;

    window.addEventListener('pointermove', onMove, { passive: true });
    window.addEventListener('pointerdown', onMove, { passive: true });
    window.addEventListener('pointerup', function (e) { if (e.pointerType !== 'mouse') off(); }, { passive: true });
    window.addEventListener('pointercancel', off, { passive: true });
    document.documentElement.addEventListener('pointerleave', off, { passive: true });
    window.addEventListener('blur', off);
    window.addEventListener('scroll', function () { rect = canvas.getBoundingClientRect(); }, { passive: true });
    document.addEventListener('visibilitychange', function () { if (document.hidden) { stop(); off(); } else start(); });
    start();
  })();
  </script>
</body>
</html>
