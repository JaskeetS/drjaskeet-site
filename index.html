<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dr. Jaskeet — Coming soon</title>
  <meta name="description" content="Dr. Jaskeet, physiotherapist. Something good is on its way: a story told in stills. Coming soon.">
  <meta name="theme-color" content="#F6F0E6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317332F'/%3E%3Ccircle cx='32' cy='27' r='9' fill='%23E8862E'/%3E%3Cpath d='M32 36v16' stroke='%23F6F0E6' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Coming-soon page: reuses the story site's opening layout, prints and colours. */
    body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
    .top { position: absolute; }
    main { flex: 1; display: grid; position: relative; overflow: hidden; }
    .soon.hero { min-height: 0; width: 100%; padding-bottom: 40px; align-content: center; }

    .pill {
      display: inline-flex; align-items: center; gap: 10px;
      width: fit-content;
      padding: 8px 16px 8px 12px;
      border-radius: 999px;
      background: var(--white);
      box-shadow: 0 1px 0 rgba(28, 43, 40, .08), 0 8px 20px -12px rgba(28, 43, 40, .4);
      font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
      color: var(--juice-deep);
    }
    .pill i {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--juice);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(232, 134, 46, .55); }
      50% { box-shadow: 0 0 0 9px rgba(232, 134, 46, 0); }
    }

    .signoff {
      font-family: var(--hand);
      font-size: clamp(26px, 3.4vw, 34px);
      line-height: 1.1;
      color: var(--green);
      transform: rotate(-2deg);
      transform-origin: left center;
      margin-top: 6px;
    }

    /* Gentle entrance, then the prints bob like they're pinned to a string. */
    .soon .hero__text > * { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }
    .soon .hero__text > :nth-child(2) { animation-delay: .1s; }
    .soon .hero__text > :nth-child(3) { animation-delay: .2s; }
    .soon .hero__text > :nth-child(4) { animation-delay: .32s; }
    @keyframes rise { from { opacity: 0; translate: 0 18px; } }

    .soon .print { animation: drop .9s cubic-bezier(.2, .8, .2, 1) both, bob 6s ease-in-out infinite; }
    .soon .print--a { animation-delay: .35s, 1.3s; }
    .soon .print--b { animation-delay: .5s, 1.9s; animation-duration: .9s, 7s; }
    .soon .print--c { animation-delay: .65s, 1.6s; animation-duration: .9s, 6.5s; }
    @keyframes drop { from { opacity: 0; translate: 0 -40px; } }
    @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -9px; } }

    .rays { transform-origin: 60px 56px; animation: spin 24s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Soft confetti dots in the background. */
    .dots { position: absolute; inset: 0; pointer-events: none; z-index: -1; }
    .dots span {
      position: absolute; border-radius: 50%;
      animation: bob 8s ease-in-out infinite;
    }
    .dots span:nth-child(1) { width: 14px; height: 14px; background: var(--juice); right: 30%; top: 7%; }
    .dots span:nth-child(2) { width: 22px; height: 22px; background: var(--sage); right: 10%; top: 14%; animation-delay: -2s; }
    .dots span:nth-child(3) { width: 10px; height: 10px; background: var(--green); left: 46%; top: 11%; animation-delay: -4s; opacity: .7; }
    .dots span:nth-child(4) { width: 18px; height: 18px; background: var(--blush); left: 5%; bottom: 12%; animation-delay: -1s; }
    .dots span:nth-child(5) { width: 12px; height: 12px; background: var(--juice); right: 6%; bottom: 20%; animation-delay: -5s; opacity: .8; }
    .dots span:nth-child(6) { width: 8px; height: 8px; background: var(--green); right: 38%; bottom: 7%; animation-delay: -3s; opacity: .6; }

    .foot { padding-bottom: 24px; }
    @media (min-width: 900px) {
      .soon.hero { padding-top: calc(var(--header) + 16px); }
    }
  </style>
</head>
<body>

  <header class="top">
    <span class="wordmark">Dr. Jaskeet<span>Physiotherapist</span></span>
  </header>

  <main>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>

    <section class="hero soon">
      <div class="hero__text">
        <p class="pill"><i></i>Coming soon</p>
        <h1>Something good<br><em>is on its way.</em></h1>
        <p class="lede">I'm a physiotherapist, and I'm putting together a few stories from my working days. There's a flower, a glass of orange juice, and a lot of happy first steps.</p>
        <p class="signoff">See you here very soon!</p>
      </div>

      <div class="hero__stack" aria-hidden="true">
        <figure class="print print--a">
          <div class="print__img tone-sage">
            <svg viewBox="0 0 120 150">
              <path d="M60 138V74" class="ln"/>
              <path d="M60 112c-14-2-22-10-24-22 13 0 21 8 24 22zM60 100c12-3 19-10 21-21-12 1-19 8-21 21z" class="ln"/>
              <g class="fill">
                <circle cx="60" cy="38" r="11"/><circle cx="43" cy="50" r="11"/><circle cx="77" cy="50" r="11"/>
                <circle cx="49" cy="68" r="11"/><circle cx="71" cy="68" r="11"/>
              </g>
              <circle cx="60" cy="55" r="8" class="dot"/>
            </svg>
          </div>
          <figcaption>a flower</figcaption>
        </figure>
        <figure class="print print--b">
          <div class="print__img tone-juice">
            <svg viewBox="0 0 120 150">
              <g transform="rotate(-10 42 86)">
                <path d="M28 58h30l-4 56H32z" class="ln"/>
                <path d="M30 76h26l-2.6 36H32.6z" class="fill"/>
              </g>
              <g transform="rotate(10 78 86)">
                <path d="M62 58h30l-4 56H66z" class="ln"/>
                <path d="M64 76h26l-2.6 36H66.6z" class="fill"/>
              </g>
              <path d="M60 30v12M46 36l5 9M74 36l-5 9" class="ln"/>
            </svg>
          </div>
          <figcaption>cheers!</figcaption>
        </figure>
        <figure class="print print--c">
          <div class="print__img tone-blush">
            <svg viewBox="0 0 120 150">
              <circle cx="60" cy="56" r="20" class="fill"/>
              <path class="ln rays" d="M60 20v8M60 84v8M24 56h8M88 56h8M35 31l6 6M79 75l6 6M85 31l-6 6M41 75l-6 6"/>
              <path d="M14 122c18-10 34-10 46 0s30 10 46 0" class="ln"/>
            </svg>
          </div>
          <figcaption>good days</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>© 2026 Dr. Jaskeet</span>
    <span>drjaskeet.com</span>
  </footer>

</body>
</html>
